services:
  - type: web
    name: campus-tasks-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/visiondigitalsn-hub/campus-tasks
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: campus-tasks-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campus-tasks-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campus-tasks-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: campus-tasks-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campus-tasks-db
          property: password
      - key: TOKEN_HOURS
        value: "24"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=15"
databases:
  - name: campus-tasks-db
    plan: free
    region: frankfurt
    databaseName: campustasks
    user: campustasks
    postgresMajorVersion: "17"
    ipAllowList: []
