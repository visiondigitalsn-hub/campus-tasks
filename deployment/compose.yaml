name: campustasks
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campustasks
      POSTGRES_USER: ${DB_USER:?Configure DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d campustasks"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  api:
    image: ${API_IMAGE:?Configure API_IMAGE}:${API_VERSION:?Configure API_VERSION}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/campustasks
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TOKEN_HOURS: ${TOKEN_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    networks: [private, edge]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres-data:
networks:
  private:
    internal: true
  edge:
