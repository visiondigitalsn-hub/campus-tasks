services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configure API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge]
volumes:
  caddy-data:
  caddy-config:
